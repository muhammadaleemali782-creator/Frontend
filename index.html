<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yes or No</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top, rgba(255,192,203,0.25), transparent 60%),
    linear-gradient(135deg, #ff4d6d, #b5179e, #240046);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  position: relative;
  .romantic-glow {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(255,182,193,0.18), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
}

/* DISPLAY BOX */
#displayBox {
  width: 420px;
  max-width: 92%;
  background: linear-gradient(145deg,#0f172a,#020617);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 22px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.8);
  text-align: center;
  z-index: 2;
}

#displayBox img,
#displayBox video {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 14px;
  background: #000;
  display: none;
}

#displayNote {
  margin-top: 14px;
  font-size: 1.1rem;
  color: #f8fafc;
  font-weight: 500;
}

/* BUTTON WRAP */
#buttonWrap {
  position: relative;
  display: flex;
  gap: 20px;
  align-items: center;
}

/* YES */
#btnYes {
  padding: 14px 52px;
  border: none;
  border-radius: 14px;
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  box-shadow: 0 10px 30px rgba(34,197,94,.45);
  z-index: 3;

   margin-left: -100px;   /* 👈 LEFT ki taraf */
}

/* NO */
#btnNo {
  position: fixed;
  padding: 14px 52px;
  border: none;
  border-radius: 14px;
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg,#ef4444,#b91c1c);
  box-shadow: 0 10px 30px rgba(239,68,68,.45);
  z-index: 999;
  transition: transform 0.12s ease;
}

/* MODAL */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  z-index: 1000;
}
#modal.show {
  opacity: 1;
  pointer-events: auto;
}

#modalInner img,
#modalInner video {
  max-width: 92vw;
  max-height: 88vh;
  border-radius: 18px;
  display: none;
}

#modalClose {
  position: fixed;
  top: 18px;
  right: 22px;
  background: none;
  border: none;
  color: #fff;
  font-size: 2.2rem;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="displayBox">
  <img id="topImg">
  <video id="topVideo" autoplay loop></video>
  <div id="displayNote">Loading...</div>
</div>

<div id="buttonWrap">
  <button id="btnYes">YES</button>
</div>

<button id="btnNo">NO</button>

<div id="modal" onclick="closeModal(event)">
  <button id="modalClose" onclick="closeModal(event,true)">✕</button>
  <div id="modalInner">
    <img id="yesImg">
    <!-- ❌ autoplay removed -->
    <video id="yesVideo" controls></video>
  </div>
</div>

<script>
const btnYes = document.getElementById("btnYes");
const btnNo  = document.getElementById("btnNo");
const modal  = document.getElementById("modal");
const buttonWrap = document.getElementById("buttonWrap");

const topImg = document.getElementById("topImg");
const topVideo = document.getElementById("topVideo");
const yesImg = document.getElementById("yesImg");
const yesVideo = document.getElementById("yesVideo");
const displayNote = document.getElementById("displayNote");

let notes = [];
let noteIndex = 0;
let globalAudio = null;

/* MEDIA SET */
function setMedia(data, img, video) {
  if (!data || !data.url) return;
  if (data.type?.startsWith("video/")) {
    img.style.display = "none";
    video.src = data.url;
    video.style.display = "block";
  } else {
    video.style.display = "none";
    img.src = data.url;
    img.style.display = "block";
  }
}

/* LOADERS */
async function loadTopMedia() {
  try {
    setMedia(await (await fetch("http://localhost:3000/get-top-media")).json(), topImg, topVideo);
  } catch {}
}
async function loadYesMedia() {
  try {
    setMedia(await (await fetch("http://localhost:3000/get-yes-media")).json(), yesImg, yesVideo);
  } catch {}
}
async function loadTopNote() {
  try {
    const d = await (await fetch("http://localhost:3000/get-top-note")).json();
    displayNote.textContent = d.text || "";
  } catch {}
}
async function loadNotes() {
  try {
    notes = (await (await fetch("http://localhost:3000/get-notes")).json()).notes || [];
  } catch {}
}
async function loadSound() {
  try {
    const d = await (await fetch("http://localhost:3000/get-sound")).json();
    if (d.soundUrl) globalAudio = new Audio(d.soundUrl);
  } catch {}
}

/* PLACE NO NEXT TO YES (FIXED) */
function placeNoInitial() {
  const r = btnYes.getBoundingClientRect();
  btnNo.style.left = r.right + 18 + "px";
  btnNo.style.top  = r.top + "px";
}

/* NO RUNS FULL SCREEN */
btnNo.onclick = () => {
  const pad = 20;
  const maxX = window.innerWidth - btnNo.offsetWidth - pad;
  const maxY = window.innerHeight - btnNo.offsetHeight - pad;

  btnNo.style.left = Math.random() * maxX + "px";
  btnNo.style.top  = Math.random() * maxY + "px";

  if (notes.length) {
    const t = typeof notes[noteIndex] === "string"
      ? notes[noteIndex]
      : notes[noteIndex].text;
    btnNo.textContent = t;
    noteIndex = (noteIndex + 1) % notes.length;
  }

  btnNo.style.transform = "scale(1.25)";
  setTimeout(() => btnNo.style.transform = "scale(1)", 120);

  if (globalAudio) {
    globalAudio.currentTime = 0;
    globalAudio.play();
  }
  if (navigator.vibrate) navigator.vibrate(60);
};

/* YES CLICK → PURE ROMANTIC MODE */
btnYes.onclick = () => {

  // ✅ TOP VIDEO AUTO PAUSE
  if (!topVideo.paused) {
    topVideo.pause();
  }

  displayBox.style.display = "none";
  buttonWrap.style.display = "none";
  btnNo.style.display = "none";

  modal.classList.add("show");

  if (yesVideo.src) {
    yesVideo.currentTime = 0;
    yesVideo.play(); // ✅ PLAY ONLY NOW
  }
};

function closeModal(e, force) {
  if (force || e.target === modal) {
    modal.classList.remove("show");
    yesVideo.pause();
    yesVideo.currentTime = 0;
  }
}

/* INIT */
window.onload = () => {
  loadTopMedia();
  loadYesMedia();
  loadTopNote();
  loadNotes();
  loadSound();
  setTimeout(placeNoInitial, 150);
};
</script>
<div class="romantic-glow"></div>
</body>
</html>
